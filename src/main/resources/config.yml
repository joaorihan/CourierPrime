
lang: "en-us"

receive-delay: 100
resend-delay: 2400
remove-delay: 200
spawn-distance: 5
default-courier-entity-type: VILLAGER
blocked-gamemodes: []
blocked-worlds: []

# Custom Entity Support (MythicMobs / ModelEngine)
custom-entities:
  # Enable custom entity plugins for courier spawning
  enabled: false
  
  # The custom entity/mob ID to spawn
  # For MythicMobs: The mob ID defined in your MythicMobs config
  # For ModelEngine: The model ID to attach to the courier
  entity-id: "Courier"
  
  # Which plugin to use: AUTO, MYTHICMOBS, or MODELENGINE
  # AUTO: MythicMobs takes priority if both are installed
  preferred-plugin: "AUTO"
  
  # Base entity type for ModelEngine (only used when ModelEngine is the active plugin)
  modelengine-base-entity: "ARMOR_STAND"

letter:
  # if the creation of anonymous letters is enabled.
  anonymous-letters-enabled: true     # default: true

  # if the letter items will support custom model data
  use-custom-model-data: false        # default: false

  # custom model data of letter items.
  # only works if use-custom-model-data is set to true
  letter-custom-model-data: 0
  anon-letter-custom-model-data: 0

# Add any EntityType you'd like your players be able to use as Couriers
# List of EntityTypes https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/EntityType.html
enabled-courier-types:
  - COW
  - SHEEP
  - PIG
  - CHICKEN
  - RABBIT
  - HORSE
  - VILLAGER
  - ALLAY
  - PARROT