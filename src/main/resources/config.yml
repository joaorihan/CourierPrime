
lang: "en-us"

receive-delay: 100
resend-delay: 2400
remove-delay: 200
spawn-distance: 5
default-courier-entity-type: VILLAGER
blocked-gamemodes: []
blocked-worlds: []

# ModelEngine base entity type (used when spawning meg: couriers)
modelengine-base-entity: "ARMOR_STAND"

letter:
  # if the creation of anonymous letters is enabled.
  anonymous-letters-enabled: true     # default: true

  # if the letter items will support custom model data
  use-custom-model-data: false        # default: false

  # custom model data of letter items.
  # only works if use-custom-model-data is set to true
  letter-custom-model-data: 0
  anon-letter-custom-model-data: 0

# Courier types that players can select with /courier select
# Supports three formats:
#   - Vanilla EntityTypes: VILLAGER, COW, SHEEP, etc.
#     (List: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/EntityType.html)
#   - MythicMobs: mm:MOB_ID (e.g., mm:WITHER_SOLDIER, mm:CustomCourier)
#   - ModelEngine: meg:MODEL_ID (e.g., meg:ALPINE_COW, meg:courier_dragon)
enabled-courier-types:
  - COW
  - SHEEP
  - PIG
  - CHICKEN
  - RABBIT
  - HORSE
  - VILLAGER
  - ALLAY
  - PARROT
  # Examples for custom entities (uncomment to enable):
  # - mm:CourierOwl
  # - mm:FancyHorse
  # - meg:courier_model
  # - meg:delivery_dragon
